spring.application.name=portfolio-backend

#MySQL DB Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=UTC
#spring.datasource.url- tells Spring where MySQL is running
#Format: jdbc:mysql://HOST:PORT/DATABASE_NAME?options
#localhost::3306 is the default MySQL address on your machine
#useSSL=false: disables SSl for local development(enable for production)
#serverTimezone:UTC: avoids timezone-related errors

spring.datasource.username=root
spring.datasource.password=root

#JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
#hibernate.ddl.auto- auto controls how hibernate manages your database schemas
#update- adds new columns/tables if needed, never deletes, therefore safe

spring.jpa.show-sql=true
#shows actual SQL queries Hibernate generates in your console.For learning and debuggining.Turn off in production
